name: Static and portable tests
on:
  push:
  pull_request:
jobs:
  portable:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.3.0-rc7
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q contracts scripts tests
      - run: python -m pip install -r requirements-test.txt
      - name: Validate pinned runner and contracts
        run: |
          genvm-lint check contracts/coverage_seal.py
          genvm-lint validate contracts/coverage_seal.py
          genvm-lint check contracts/coverage_gate.py
          genvm-lint validate contracts/coverage_gate.py
          python scripts/prepare_direct_runner.py
      - run: python -m pytest tests/unit -q
      - run: python -m pytest tests/direct -q
      - run: python scripts/preflight.py --final
      - name: Strict type checking
        run: |
          genvm-lint typecheck contracts/coverage_seal.py --strict
          genvm-lint typecheck contracts/coverage_gate.py --strict
      - name: Generate ABI schemas
        run: |
          genvm-lint schema contracts/coverage_seal.py --output artifacts/coverage-seal-abi.json
          genvm-lint schema contracts/coverage_gate.py --output artifacts/coverage-gate-abi.json
      - uses: actions/upload-artifact@v4
        with:
          name: contract-abis
          path: artifacts/*-abi.json
